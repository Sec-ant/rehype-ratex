<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rehype-ratex — LaTeX to SVG</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"
    integrity="sha384-5TcZemv2l/9On385z///+d7MSYlvIEw9FuZTIdZ14vJLqWphw7e7ZPuOiCHJcFCP" crossorigin="anonymous" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
    }

    :root {
      color-scheme: light dark;
      --bg: #fafaf9;
      --fg: #1c1917;
      --muted: #78716c;
      --border: #d6d3d1;
      --surface: #fff;
      --accent: #2563eb;
      --accent-bg: #eff6ff;
      --error: #dc2626;
      --error-bg: #fef2f2;
      --mono: "SF Mono", "Cascadia Code", "Fira Code", ui-monospace,
        monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --fg: #e7e5e4;
        --muted: #a8a29e;
        --border: #44403c;
        --surface: #292524;
        --accent: #60a5fa;
        --accent-bg: #172554;
        --error: #f87171;
        --error-bg: #2c1518;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
        sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
      min-height: 100dvh;
      padding: 3rem 1.5rem;
    }

    .container {
      max-width: 660px;
      margin: 0 auto;
    }

    h1 {
      font-family: var(--mono);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    h1 span {
      color: var(--muted);
      font-weight: 400;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .section {
      margin-top: 1.75rem;
    }

    label {
      display: block;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.375rem;
    }

    /* --- Examples --- */
    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
      margin-top: 0.5rem;
    }

    .examples button {
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 0.25rem 0.625rem;
      border: 1px solid var(--border);
      border-radius: 99px;
      background: var(--surface);
      color: var(--fg);
      cursor: pointer;
      transition:
        border-color 0.15s,
        background 0.15s;
      white-space: nowrap;
    }

    .examples button:hover {
      border-color: var(--accent);
      background: var(--accent-bg);
    }

    /* --- Inputs --- */
    .input-row {
      display: flex;
      gap: 0.75rem;
    }

    .input-row .latex-field {
      flex: 1;
    }

    textarea {
      font-family: var(--mono);
      font-size: 0.9375rem;
      line-height: 1.6;
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--fg);
      outline: none;
      transition: border-color 0.15s;
      resize: vertical;
      min-height: 2.75rem;
      field-sizing: content;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    /* --- Options --- */
    .options {
      display: flex;
      gap: 1.25rem;
      margin-top: 0.375rem;
    }

    .options label {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.8125rem;
      font-weight: 400;
      text-transform: none;
      letter-spacing: normal;
      color: var(--fg);
      cursor: pointer;
      user-select: none;
    }

    .options input[type="checkbox"] {
      width: auto;
      accent-color: var(--accent);
    }

    /* --- Output --- */
    .preview-box {
      padding: 1.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      min-height: 4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: auto;
    }

    .preview-box:empty::before {
      content: "Type LaTeX above";
      color: var(--muted);
      font-style: italic;
      font-size: 0.875rem;
    }

    .preview-box svg {
      max-width: 100%;
      height: auto;
    }

    .error-box {
      font-family: var(--mono);
      font-size: 0.8125rem;
      line-height: 1.5;
      padding: 0.5rem 0.75rem;
      border: 1px solid transparent;
      border-radius: 6px;
      background: var(--error-bg);
      color: var(--error);
      margin-top: 0.5rem;
      display: none;
    }

    .error-box.visible {
      display: block;
    }

    /* --- SVG source --- */
    .sep {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.75rem 0;
    }

    .svg-source {
      font-family: var(--mono);
      font-size: 0.75rem;
      line-height: 1.6;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--fg);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 12rem;
      overflow-y: auto;
      min-height: 2.625rem;
      cursor: text;
      user-select: all;
    }

    .svg-source:empty::before {
      content: "\2014";
      color: var(--muted);
    }

    /* --- Status bar --- */
    .status {
      font-size: 0.75rem;
      color: var(--muted);
      min-height: 1.125rem;
      margin-bottom: 0.375rem;
    }

    /* --- Footer --- */
    .footer {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2.5rem;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>rehype-ratex <span>playground</span></h1>
    <p class="subtitle">
      Render LaTeX to inline SVG with
      <a href="https://github.com/erweixin/RaTeX" style="color: var(--accent); text-decoration: none;">RaTeX</a>
      (Rust/WASM).
    </p>

    <div class="section">
      <label>Examples</label>
      <div class="examples" id="examples"></div>
    </div>

    <div class="section">
      <label for="latex">LaTeX input</label>
      <textarea id="latex" spellcheck="false" autocomplete="off"></textarea>
      <div class="options">
        <label>
          <input type="checkbox" id="opt-display" />
          display mode
        </label>
      </div>
    </div>

    <div class="section">
      <label>Preview</label>
      <div class="preview-box" id="preview"></div>
      <div class="error-box" id="error"></div>
    </div>

    <hr class="sep" />

    <div class="section">
      <div class="status" id="status"></div>
      <label>SVG source</label>
      <div class="svg-source" id="svg-source"></div>
    </div>

    <p class="footer">
      <a href="https://github.com/Sec-ant/rehype-ratex">@sec-ant/rehype-ratex</a> &mdash;
      LaTeX to SVG via Rust/WASM, zero client-side runtime.
    </p>
  </div>
  <script type="module" src="./main.ts"></script>
</body>

</html>
